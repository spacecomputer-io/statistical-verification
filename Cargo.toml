[package]
name = "statistical-verification"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for statistical testing of RNGs using TestU01 and PractRand"
license = "MIT"
repository = "https://github.com/spacecomputer-io/statistical-verification"
homepage = "https://docs.spacecomputer.io"
keywords = ["cryptography", "random", "verification", "entropy", "rng"]
categories = ["cryptography"]
build = "build.rs"

[dependencies]
once_cell = "1"
rand_core = "0.6"

[dev-dependencies]
rand_chacha = "0.3"
rand = "0.8"

[build-dependencies]
bindgen = "0.69"
